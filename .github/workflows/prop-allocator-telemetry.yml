name: Prop allocator telemetry

on:
  pull_request:
    paths:
      - '.github/workflows/prop-allocator-telemetry.yml'
      - 'getv/port/src/ge_launcher.cpp'
      - 'getv/port/src/ge_developer_tools.h'
      - 'getv/port/tests/test_developer_tools.c'
      - 'getv/port/src/ge_prop_allocator_telemetry.c'
      - 'getv/port/src/ge_prop_allocator_telemetry.h'
      - 'getv/port/src/port_render.c'
      - 'getv/port/tests/test_prop_allocator_telemetry.c'
      - 'getv/patches/0028-prop-allocator-telemetry.patch'
      - 'tools/setup.sh'
      - 'tools/setup-mac.sh'
      - 'tools/setup-windows.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/prop-allocator-telemetry.yml'
      - 'getv/port/src/ge_launcher.cpp'
      - 'getv/port/src/ge_developer_tools.h'
      - 'getv/port/tests/test_developer_tools.c'
      - 'getv/port/src/ge_prop_allocator_telemetry.c'
      - 'getv/port/src/ge_prop_allocator_telemetry.h'
      - 'getv/port/src/port_render.c'
      - 'getv/port/tests/test_prop_allocator_telemetry.c'
      - 'getv/patches/0028-prop-allocator-telemetry.patch'
      - 'tools/setup.sh'
      - 'tools/setup-mac.sh'
      - 'tools/setup-windows.sh'

permissions:
  contents: read

jobs:
  linux:
    name: prop-allocator-telemetry-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run the required ROM-free producer checks
        shell: bash
        run: |
          test -f getv/port/tests/test_prop_allocator_telemetry.c
          bash getv/port/tests/run_tests.sh prop_allocator
          test -f getv/port/tests/test_developer_tools.c
          bash getv/port/tests/run_tests.sh developer_tools
      - name: Fetch pinned decomp source (no ROM or generated runtime data)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: n64decomp/007
          ref: c4356466796c697dfd298010b9bed261f9ed8c6a
          path: vendor/ge-decomp
          persist-credentials: false
      - name: Prove the complete source patch stack round-trips
        run: bash tools/check_patches.sh

  windows:
    name: prop-allocator-telemetry-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch supported standalone MinGW toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same pinned WinLibs release as tools/fetch_deps_windows.ps1.
          $url = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r1.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'winlibs.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = 'c1f52294597c0b73786b2a78eb5d176d89226d2f21875eab75e783a8b1cefcc4'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'WinLibs checksum mismatch'
          }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
      - name: Run required report and launcher policy checks
        shell: pwsh
        run: |
          $mingw = Join-Path $env:RUNNER_TEMP 'mingw64'
          if (!(Test-Path getv/port/tests/test_prop_allocator_telemetry.c) -or
              !(Test-Path getv/port/tests/test_developer_tools.c)) { throw 'Required tests missing' }
          & getv/port/tests/run_tests.ps1 -Mingw $mingw -Filter prop_allocator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & getv/port/tests/run_tests.ps1 -Mingw $mingw -Filter developer_tools
          exit $LASTEXITCODE
