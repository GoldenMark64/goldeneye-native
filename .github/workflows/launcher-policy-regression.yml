name: Launcher policy regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: launcher-policy-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run ROM-free launcher startup policy checks
        run: |
          test -f getv/port/tests/test_launcher_policy.c || {
            echo "required launcher policy regression is missing" >&2
            exit 1
          }
          bash getv/port/tests/run_tests.sh launcher_policy
