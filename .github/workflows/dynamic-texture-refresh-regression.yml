name: Dynamic texture refresh regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dynamic-texture-refresh:
    name: dynamic-texture-refresh-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reconstruct pinned Fast3D source
        run: bash tools/fetch-thirdparty.sh
      - name: Verify third-party patch stack
        run: bash tools/fetch-thirdparty.sh verify
      - name: Run dynamic texture refresh regression
        run: python3 tools/tests/test_dynamic_texture_refresh.py
