name: Package Windows setup

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/windows-setup-package.yml"
      - "getv/build_wizard.ps1"
      - "getv/patches/**"
      - "getv/wizard/**"
      - "getv/port/src/ge_icon_apply.c"
      - "Play GoldenEye.cmd"
      - "tools/fetch_deps_windows.ps1"
      - "tools/install.ps1"
      - "tools/package_windows_wizard.ps1"
      - "tools/setup-windows.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-setup-package.yml"
      - "getv/build_wizard.ps1"
      - "getv/patches/**"
      - "getv/wizard/**"
      - "getv/port/src/ge_icon_apply.c"
      - "Play GoldenEye.cmd"
      - "tools/fetch_deps_windows.ps1"
      - "tools/install.ps1"
      - "tools/package_windows_wizard.ps1"
      - "tools/setup-windows.sh"

permissions:
  contents: read

jobs:
  package:
    name: windows-setup-package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python for publication checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Reject ROMs, saves, and non-public artifacts
        run: python tools/check_no_game_data.py --tracked

      - name: Cache Windows wizard toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\mingw64
            ~\.n64tvos\imgui-win
          key: windows-wizard-${{ hashFiles('tools/fetch_deps_windows.ps1') }}

      - name: Build, test, and stage the ROM-free package
        shell: powershell
        run: >-
          .\tools\package_windows_wizard.ps1
          -RepoUrl '${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}'
          -RepoRef '${{ github.head_ref || github.ref_name }}'

      - name: Upload Windows setup package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GoldenEye-Native-Windows-Setup-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30
