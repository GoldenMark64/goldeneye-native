name: objDeform rwdata regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            compiler: gcc
          - os: macos-latest
            platform: macos
            compiler: clang

    name: objdeform-rwdata-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned decomp source
        run: |
          git clone -q --filter=blob:none https://github.com/n64decomp/007 vendor/ge-decomp
          git -C vendor/ge-decomp checkout -q --detach c4356466796c697dfd298010b9bed261f9ed8c6a

      - name: Reconstruct pre-0061 source and preserve negative control
        shell: bash
        run: |
          set -euo pipefail
          for p in getv/patches/0*.patch; do
            case "$(basename "$p")" in
              0002-*|0061-playtested-native-source-catchup.patch) continue ;;
            esac
            git -C vendor/ge-decomp apply "$GITHUB_WORKSPACE/$p"
          done
          cp vendor/ge-decomp/src/game/propobj.c "$RUNNER_TEMP/propobj-before-0061.c"

      - name: Apply 0061 source catch-up
        run: git -C vendor/ge-decomp apply "$GITHUB_WORKSPACE/getv/patches/0061-playtested-native-source-catchup.patch"

      - name: Reproduce pre-0061 rwdata failure
        run: >-
          python3 tools/tests/test_objdeform_rwdata.py
          --cc ${{ matrix.compiler }}
          --objdeform-source "$RUNNER_TEMP/propobj-before-0061.c"
          --expect vulnerable

      - name: Verify 0061 objDeform repair
        run: >-
          python3 tools/tests/test_objdeform_rwdata.py
          --cc ${{ matrix.compiler }}
          --expect fixed

  windows:
    name: objdeform-rwdata-windows
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch supported standalone MinGW toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r1.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'winlibs.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = 'c1f52294597c0b73786b2a78eb5d176d89226d2f21875eab75e783a8b1cefcc4'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'WinLibs checksum mismatch'
          }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP

      - name: Check out pinned decomp source
        shell: pwsh
        run: |
          git clone -q --filter=blob:none https://github.com/n64decomp/007 vendor/ge-decomp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C vendor/ge-decomp checkout -q --detach c4356466796c697dfd298010b9bed261f9ed8c6a
          exit $LASTEXITCODE

      - name: Reconstruct pre-0061 source and preserve negative control
        shell: pwsh
        run: |
          Get-ChildItem getv/patches -Filter '0*.patch' | Sort-Object Name | ForEach-Object {
            if ($_.Name -like '0002-*' -or $_.Name -eq '0061-playtested-native-source-catchup.patch') {
              return
            }
            git -C vendor/ge-decomp apply $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Copy-Item vendor/ge-decomp/src/game/propobj.c (Join-Path $env:RUNNER_TEMP 'propobj-before-0061.c')

      - name: Apply 0061 source catch-up
        shell: pwsh
        run: |
          git -C vendor/ge-decomp apply "$env:GITHUB_WORKSPACE/getv/patches/0061-playtested-native-source-catchup.patch"
          exit $LASTEXITCODE

      - name: Reproduce pre-0061 rwdata failure
        shell: pwsh
        run: |
          $gcc = Join-Path $env:RUNNER_TEMP 'mingw64/bin/gcc.exe'
          $before = Join-Path $env:RUNNER_TEMP 'propobj-before-0061.c'
          python tools/tests/test_objdeform_rwdata.py --cc $gcc --objdeform-source $before --expect vulnerable
          exit $LASTEXITCODE

      - name: Verify 0061 objDeform repair
        shell: pwsh
        run: |
          $gcc = Join-Path $env:RUNNER_TEMP 'mingw64/bin/gcc.exe'
          python tools/tests/test_objdeform_rwdata.py --cc $gcc --expect fixed
          exit $LASTEXITCODE
