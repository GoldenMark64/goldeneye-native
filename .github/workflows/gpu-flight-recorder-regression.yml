name: GPU submission flight recorder regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gpu-flight-recorder:
    name: gpu-flight-recorder-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reconstruct pinned Fast3D sources
        run: bash tools/fetch-thirdparty.sh
      - name: Verify third-party reconstruction
        run: bash tools/fetch-thirdparty.sh verify
      - name: Run GPU flight recorder regression
        run: python3 tools/tests/test_gpu_flight_recorder.py
